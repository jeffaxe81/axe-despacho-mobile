name: Mobile quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Public repository safety
        run: node scripts/public-repo-guard.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Release readiness — verified real-environment gate percentage
        run: |
          npm run test:readiness
          npm run readiness:mobile
      - name: Web bundle
        run: npm run build
