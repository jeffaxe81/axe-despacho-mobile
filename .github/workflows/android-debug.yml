name: Android APK (debug)
on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/android/**'
      - 'native/android/**'
      - 'scripts/public-repo-guard.mjs'
      - 'package.json'
      - 'capacitor.config.ts'
      - 'index.html'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/android-debug.yml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true
jobs:
  debug-apk:
    name: Capacitor Android / debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # ubuntu-latest already includes Android SDK command line tools.
      # The setup-android v3 action currently requests removed sdkmanager "tools".
      - name: Find runner Android SDK manager
        run: |
          test -n "${ANDROID_HOME:-}" || (echo "ANDROID_HOME indisponível" && exit 1)
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER" || (echo "sdkmanager ausente no runner" && exit 1)
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
      - name: Install Android SDK 36
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Public repository safety
        run: node scripts/public-repo-guard.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Web compile and unit tests
        run: |
          npm run check
          npm test
          npm run build
      - name: Exercise native OAuth callback guard on Java 21
        run: node scripts/android/test-native-callback.mjs
      - name: Generate Capacitor Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Install Android GPS laboratory service
        run: node scripts/android/install-location-lab.mjs
      - name: Verify native safety gates
        run: npm run android:verify
      - name: Build Android debug package
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Upload debug APK (not approved for operations)
        uses: actions/upload-artifact@v4
        with:
          name: axe-despacho-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  emulator-smoke:
    name: Emulator smoke — Android API ${{ matrix.api-level }}
    needs: debug-apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        api-level: [34, 35, 36]
    steps:
      - uses: actions/checkout@v4
      - name: Download previously built lab APK
        uses: actions/download-artifact@v4
        with:
          name: axe-despacho-android-debug
          path: artifacts/android-apk
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Validate installation, foreground safety and lifecycle
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          script: bash scripts/android/emulator-smoke.sh
      - name: Save synthetic emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axe-despacho-emulator-api-${{ matrix.api-level }}
          path: artifacts/android-emulator-smoke/
          if-no-files-found: warn
          retention-days: 7
